name: 🐛 バグ報告
description: 動作がおかしい・エラーが出る場合の報告
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 何が起きましたか
      placeholder: 実際に起きた動作・エラーメッセージ
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      placeholder: 1. ...\n2. ...\n3. ...
      description: 分かる範囲で。実行したコマンドや操作手順があると助かります
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      placeholder: 本来どうなるべきか
  - type: textarea
    id: env
    attributes:
      label: 環境
      placeholder: OS / ブラウザ / バージョンなど
  - type: input
    id: ai_tool
    attributes:
      label: AI ツール使用
      description: AI が作った報告・コードを含む場合はツール名を書いてください（例: Devin, Copilot）。未使用なら空欄でOK
      placeholder: AI-generated:
